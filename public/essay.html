<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essay · Max (Jinghan) Lan</title>
<meta name="description" content="An essay by Max (Jinghan) Lan.">
<meta name="theme-color" content="#000000">
<link rel="preload" href="fonts/source-serif.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* One essay page for every essay: essay.html?e=<name> reads that essay from index.html,
     so text edited and saved on the main page shows up here as written. */
  @font-face { font-family: "Source Serif"; src: url(fonts/source-serif.woff2) format("woff2"); font-weight: 300 650; font-display: swap; }
  @font-face { font-family: "Mona Text"; src: url(fonts/mona-text.woff2) format("woff2"); font-weight: 200 600; font-display: swap; }

  :root { --void: #000; --ink: #f6f8fd; --ink-quiet: rgba(246, 248, 253, 0.74); --limb: #eaf2ff; --focus: #a9c6ff; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--void); color: var(--ink); }
  body {
    font-family: "Source Serif", Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  }
  a:focus-visible { outline: 1.5px solid var(--focus); outline-offset: 3px; border-radius: 3px; }

  /* How far through the essay you are, as a thin line of light across the top. */
  .progress { position: fixed; inset: 0 0 auto 0; z-index: 20; height: 2px; background: rgba(234, 242, 255, 0.07); }
  .progress span {
    display: block; height: 100%; transform-origin: 0 50%; transform: scaleX(0);
    background: linear-gradient(90deg, rgba(140, 180, 255, 0.55), var(--limb));
    box-shadow: 0 0 12px rgba(150, 190, 255, 0.9);
  }

  /* Top-left, as on the main page: the name goes home, the line goes back to Blogs.
     Pinned only where the centered column leaves it room. */
  .masthead { position: absolute; z-index: 10; top: clamp(18px, 3vw, 40px); left: clamp(22px, 3.4vw, 52px); display: flex; flex-direction: column; gap: 20px; }
  @media (min-width: 1280px) { .masthead { position: fixed; } }
  .mark { color: var(--ink); text-decoration: none; font-size: min(31px, 7.6vw); line-height: 1.15; font-weight: 480; letter-spacing: -0.006em; }
  .mark .alt { color: var(--ink-quiet); font-weight: 380; }
  .back { display: inline-flex; align-items: center; gap: 12px; color: var(--ink-quiet); text-decoration: none; font-size: clamp(16px, 1.15vw + 5px, 19px); transition: color 280ms ease; }
  .back::before { content: ""; width: 18px; height: 1px; background: var(--limb); box-shadow: 0 0 8px rgba(150, 190, 255, 0.9); transition: width 360ms cubic-bezier(.16,1,.3,1); }
  .back:hover, .back:focus-visible { color: var(--ink); }
  .back:hover::before { width: 28px; }

  /* The essay: one centered column. */
  .essay { width: min(40rem, 100% - 44px); margin: 0 auto; padding: clamp(150px, 24vh, 250px) 0 42vh; }
  .essay-kicker { margin: 0 0 22px; text-align: center; font: 420 13px/1 "Mona Text", system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-quiet); }
  .essay h1 {
    margin: 0 0 20px; text-align: center; font-weight: 400;
    font-size: clamp(36px, 3.4vw + 12px, 60px); line-height: 1.08; letter-spacing: -0.014em;
    text-shadow: 0 0 28px rgba(140, 180, 255, 0.2); text-wrap: balance;
  }
  .essay-subtitle {
    margin: 0 auto 26px; max-width: 32rem; text-align: center; font-style: italic;
    font-size: clamp(20px, 0.6vw + 15px, 24px); line-height: 1.45; color: rgba(246, 248, 253, 0.8); text-wrap: balance;
  }
  .essay-subtitle:empty { display: none; }
  .essay-meta { margin: 0 0 clamp(56px, 10vh, 96px); text-align: center; font: 420 14px/1.4 "Mona Text", system-ui, sans-serif; letter-spacing: 0.04em; color: var(--ink-quiet); }
  .essay-meta::after { content: ""; display: block; width: 40px; height: 1px; margin: 28px auto 0; background: var(--limb); box-shadow: 0 0 10px rgba(150, 190, 255, 0.9); }

  /* Reading progresses paragraph by paragraph: each one rises in as it arrives, and the one
     at the reading line is lit while the rest wait, dimmed. */
  .essay-body p {
    margin: 0 0 1.3em; font-size: clamp(19px, 0.5vw + 14px, 22px); line-height: 1.78;
    opacity: 0; transform: translateY(0.7em);
    transition: opacity 700ms ease, transform 1000ms cubic-bezier(.16,1,.3,1), color 500ms ease;
    color: rgba(246, 248, 253, 0.42);
  }
  .essay-body p.is-seen { opacity: 1; transform: none; }
  .essay-body p.is-here { color: var(--ink); }
  .essay-end { margin-top: clamp(72px, 13vh, 130px); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .essay-end .next { color: var(--ink); text-decoration: none; font-size: clamp(22px, 1vw + 14px, 28px); }
  .essay-end .next span { display: block; margin-bottom: 8px; font: 420 12px/1 "Mona Text", system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-quiet); }
  .essay-missing { text-align: center; color: var(--ink-quiet); font-size: 19px; }
  @media (prefers-reduced-motion: reduce) {
    .essay-body p { transform: none; transition: opacity 200ms ease, color 200ms ease; }
  }
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><span id="progress"></span></div>
<header class="masthead">
  <a class="mark" id="mark" href="index.html"><span data-part="first">Max</span> <span class="alt" data-part="middle">(Jinghan)</span> <span data-part="last">Lan</span></a>
  <a class="back" href="index.html#blogs">All essays</a>
</header>
<main>
  <article class="essay" id="essay" aria-labelledby="essay-title">
    <p class="essay-kicker">Essay</p>
    <h1 id="essay-title"></h1>
    <p class="essay-subtitle" id="essay-subtitle"></p>
    <p class="essay-meta" id="essay-meta"></p>
    <div class="essay-body" id="essay-body"></div>
    <noscript><p class="essay-missing">This page needs JavaScript to show the essay. <a href="index.html#blogs" style="color:inherit">Back to Blogs</a>.</p></noscript>
    <nav class="essay-end" id="essay-end" aria-label="More essays"></nav>
  </article>
</main>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const body = $("essay-body"), bar = $("progress");
  const want = new URLSearchParams(location.search).get("e");

  function missing(text) {
    $("essay-title").textContent = "Essay not found";
    const p = document.createElement("p");
    p.className = "essay-missing"; p.textContent = text;
    body.replaceChildren(p);
    $("essay-end").replaceChildren(backLink("Back to all essays"));
  }
  function backLink(label) { const a = document.createElement("a"); a.className = "back"; a.href = "index.html#blogs"; a.textContent = label; return a; }

  fetch("index.html", { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(html => {
      const doc = new DOMParser().parseFromString(html, "text/html");
      // the name, as currently written on the main page
      for (const part of ["first", "middle", "last"]) {
        const v = doc.querySelector(`[data-edit="name-${part}"]`)?.textContent.trim();
        const el = document.querySelector(`[data-part="${part}"]`);
        if (v && el) el.textContent = v;
      }
      const posts = [...doc.querySelectorAll("#blogs .post[id]")];
      const i = posts.findIndex(p => p.id === "blog-" + want);
      if (i < 0) return missing("That essay isn't on the site, or its name in the link has changed.");
      const post = posts[i];
      const title = post.querySelector(".post-title, strong")?.textContent.trim() || "Essay";
      $("essay-title").textContent = title;
      $("essay-subtitle").textContent = post.querySelector(".post-teaser")?.textContent.trim() || "";
      $("essay-meta").textContent = post.querySelector(".meta")?.textContent.trim() || "";
      document.title = `${title} · Max (Jinghan) Lan`;
      const paras = [...post.querySelectorAll(".post-body p")].map(p => p.textContent.trim()).filter(Boolean);
      body.replaceChildren(...paras.map(t => { const p = document.createElement("p"); p.textContent = t; return p; }));

      const end = $("essay-end"), next = posts[i + 1];
      if (next) {
        const a = document.createElement("a");
        a.className = "next"; a.href = "essay.html?e=" + encodeURIComponent(next.id.replace(/^blog-/, ""));
        const s = document.createElement("span"); s.textContent = "Next essay";
        a.append(s, (next.querySelector(".post-title, strong")?.textContent.trim() || "Essay") + " →");
        end.append(a);
      }
      end.append(backLink("All essays"));
      start();
    })
    .catch(() => missing("The essay couldn't be loaded. Open this page from the site itself (not as a file), then try again."));

  function start() {
    const paras = [...body.querySelectorAll("p")];
    // paragraphs rise in as they come into view
    const seen = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("is-seen"); seen.unobserve(e.target); }
    }), { rootMargin: "0px 0px -8% 0px" });
    paras.forEach(p => seen.observe(p));
    // the paragraph at the reading line (42% down the window) is the one being read
    let here = null;
    function update() {
      const line = window.innerHeight * 0.42;
      let best = null, bestD = Infinity;
      for (const p of paras) {
        const r = p.getBoundingClientRect();
        const d = r.top > line ? r.top - line : r.bottom < line ? line - r.bottom : 0;
        if (d < bestD) { bestD = d; best = p; }
      }
      if (best !== here) { here?.classList.remove("is-here"); best?.classList.add("is-here"); here = best; }
      const max = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.transform = `scaleX(${max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 1})`;
    }
    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", update);
    update();
  }
})();
</script>
</body>
</html>
